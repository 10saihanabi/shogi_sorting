<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>将棋・王道マイナー仕分け</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .swipe-card { transition: transform 0.3s ease, opacity 0.3s; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col items-center justify-center font-sans">

    <div id="game-container" class="w-80 h-[400px] relative">
        <div id="card" class="swipe-card absolute inset-0 bg-white rounded-2xl shadow-xl flex flex-col items-center justify-center p-6 border-2 border-slate-200">
            <h2 id="strategy-name" class="text-3xl font-bold text-slate-800 mb-4 text-center">読み込み中...</h2>
            <p id="guide-text" class="text-slate-400">← 王道 (左) | マイナー (右) →</p>
        </div>
    </div>

    <div id="button-container" class="flex gap-10 mt-10">
        <button onclick="vote('major')" class="bg-blue-600 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:scale-105 active:scale-95">王道</button>
        <button onclick="vote('minor')" class="bg-red-500 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:scale-105 active:scale-95">マイナー</button>
    </div>

    <div id="result-display" class="mt-8 text-center h-24">
        <p id="result-msg" class="font-bold text-xl text-slate-800"></p>
        <div id="vote-counts" class="hidden mt-2 text-sm text-slate-500 bg-white p-3 rounded-lg shadow-inner">
            </div>
    </div>

    <script>
        // ★ここにあなたのGASウェブアプリURLを貼り付けてください
        const API_URL = "https://script.google.com/macros/s/AKfycbwEq9TZNAzfrKlpcPG7SBQWFy7nzaH2Oas19iiYSlbLh8tMISmpDMu_g3LGJVBcN8mC-A/exec"; 
        
        let currentStrategy = null;
        let isProcessing = false;

        // データを取得
        async function loadNext() {
            isProcessing = false;
            document.getElementById('vote-counts').classList.add('hidden');
            document.getElementById('result-msg').innerText = "";
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (data.length > 0) {
                    currentStrategy = data[Math.floor(Math.random() * data.length)];
                    document.getElementById('strategy-name').innerText = currentStrategy.戦法名;
                    document.getElementById('card').style.transform = "translateX(0) rotate(0)";
                    document.getElementById('card').style.opacity = "1";
                }
            } catch (e) {
                document.getElementById('strategy-name').innerText = "エラー：読み込めませんでした";
            }
        }

        // 投票する
        async function vote(choice) {
            if (!currentStrategy || isProcessing) return;
            isProcessing = true;
            
            // 1. 今の票数を取得
            let majorCount = parseInt(currentStrategy["王道数 (Left)"]) || 0;
            let minorCount = parseInt(currentStrategy["マイナー数 (Right)"]) || 0;

            // 2. 自分の1票を足す
            if (choice === 'major') majorCount++;
            else minorCount++;

            // 3. カードを飛ばす
            const card = document.getElementById('card');
            card.style.transform = choice === 'major' ? "translateX(-200px) rotate(-20deg)" : "translateX(200px) rotate(20deg)";
            card.style.opacity = "0";

            // 4. GASに送信
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ id: currentStrategy.ID, choice: choice })
            });

            // 5. 結果と票数を表示
            const isMajorOpinion = (majorCount >= minorCount) ? 'major' : 'minor';
            const resultMsg = (choice === isMajorOpinion) ? "✅ 世間と同じ感覚です！" : "❌ あなたは少数派です！";
            
            document.getElementById('result-msg').innerText = resultMsg;
            const voteDisplay = document.getElementById('vote-counts');
            voteDisplay.classList.remove('hidden');
            voteDisplay.innerHTML = `王道: <span class="text-blue-600 font-bold">${majorCount}票</span> / マイナー: <span class="text-red-600 font-bold">${minorCount}票</span>`;

            // 2.5秒待ってから次へ
            setTimeout(loadNext, 2500);
        }

        loadNext();
    </script>
</body>
</html>
